<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#252a31">
  <meta name="description" content="An interactive guide to object-oriented programming principles.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>Folio — Object-Oriented Programming</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-button menu-button" id="menuButton" aria-label="Open contents"><span></span><span></span></button>
      <a class="brand" href="#" aria-label="Folio home"><span class="brand-mark">F</span><span>Folio</span></a>
      <div class="top-actions">
        <button class="text-button font-control" id="fontDecrease" aria-label="Decrease page font size">A−</button>
        <button class="text-button" id="themeButton" aria-label="Change reading theme">Aa</button>
        <button class="text-button font-control" id="fontIncrease" aria-label="Increase page font size">A+</button>
        <button class="icon-button bookmark-button" id="bookmarkButton" aria-label="Bookmark this page">◇</button>
        <button class="icon-button settings-button" id="settingsButton" aria-label="Open settings" title="Settings">⚙</button>
      </div>
    </header>

    <aside class="sidebar" id="sidebar" aria-label="Book contents">
      <div class="sidebar-head"><span class="eyebrow">Currently reading</span><button class="close-button" id="closeButton" aria-label="Close contents">×</button></div>
      <h1>Object-Oriented<br>Programming</h1>
      <p class="book-byline">Principles for maintainable software</p>
      <div class="progress-copy"><span id="progressLabel">17% complete</span><span>6 min read</span></div>
      <div class="progress-track"><span id="progressBar" style="width:17%"></span></div>
      <nav id="contents"></nav>
      <div class="sidebar-footer"><span>Folio No. 01</span><span>2026</span></div>
    </aside>

    <main class="reader">
      <div class="ambient-shape shape-one"></div><div class="ambient-shape shape-two"></div>
      <article id="page" tabindex="-1"></article>
      <footer class="page-controls">
        <button id="prevButton" aria-label="Previous page">← <span>Previous</span></button>
        <div class="page-count"><span id="currentPage">1</span><i></i><span id="totalPages">6</span></div>
        <button id="nextButton" aria-label="Next page"><span>Next</span> →</button>
      </footer>
    </main>
  </div>
  <div class="scrim" id="scrim"></div>
  <dialog class="settings-dialog" id="settingsDialog" aria-labelledby="settingsTitle">
    <div class="settings-head">
      <div><span class="eyebrow">Preferences</span><h2 id="settingsTitle">Reading settings</h2></div>
      <button class="close-button settings-close" id="settingsCloseButton" aria-label="Close settings">×</button>
    </div>
    <label class="setting-row" for="pageSoundToggle">
      <span><strong>Page sound</strong><small>Play a short beep when switching pages</small></span>
      <input type="checkbox" id="pageSoundToggle">
      <i aria-hidden="true"></i>
    </label>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
